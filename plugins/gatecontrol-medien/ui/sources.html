<main class="md-page">
  <p class="md-intro">{{t:sources.intro}}</p>
  <div class="md-actions"><button type="button" class="btn btn-primary" id="md-add">{{t:sources.add}}</button></div>
  <div class="md-list" id="md-sources"></div>
  <p class="md-hint" id="md-empty" hidden>{{t:sources.empty}}</p>
  <section class="md-card" aria-labelledby="md-net-h">
    <div class="md-card-head"><h2 class="md-card-title" id="md-net-h">{{t:net.title}}</h2></div>
    <p class="md-hint">{{t:net.text}}</p>
    <p class="md-hint" id="md-net-all"></p>
  </section>
</main>
