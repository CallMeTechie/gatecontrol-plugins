<main class="dn-page">
  <div class="dn-tabs" role="tablist" aria-label="{{t:tabs.label}}" id="dn-tabs">
    <button type="button" role="tab" id="dn-t-overview" data-tab="overview" aria-controls="dn-p-overview" aria-selected="true">{{t:tab.overview}}</button>
    <button type="button" role="tab" id="dn-t-lists" data-tab="lists" aria-controls="dn-p-lists" aria-selected="false">{{t:tab.lists}}</button>
    <button type="button" role="tab" id="dn-t-profiles" data-tab="profiles" aria-controls="dn-p-profiles" aria-selected="false">{{t:tab.profiles}}</button>
    <button type="button" role="tab" id="dn-t-devices" data-tab="devices" aria-controls="dn-p-devices" aria-selected="false">{{t:tab.devices}}</button>
    <button type="button" role="tab" id="dn-t-log" data-tab="log" aria-controls="dn-p-log" aria-selected="false">{{t:tab.log}}</button>
    <button type="button" role="tab" id="dn-t-settings" data-tab="settings" aria-controls="dn-p-settings" aria-selected="false">{{t:tab.settings}}</button>
  </div>
  <p class="s-hint" id="dn-loading" role="status">{{t:common.loading}}</p>
  <section class="dn-panel" id="dn-p-overview" role="tabpanel" aria-labelledby="dn-t-overview" hidden></section>
  <section class="dn-panel" id="dn-p-lists" role="tabpanel" aria-labelledby="dn-t-lists" hidden></section>
  <section class="dn-panel" id="dn-p-profiles" role="tabpanel" aria-labelledby="dn-t-profiles" hidden></section>
  <section class="dn-panel" id="dn-p-devices" role="tabpanel" aria-labelledby="dn-t-devices" hidden></section>
  <section class="dn-panel" id="dn-p-log" role="tabpanel" aria-labelledby="dn-t-log" hidden></section>
  <section class="dn-panel" id="dn-p-settings" role="tabpanel" aria-labelledby="dn-t-settings" hidden></section>
</main>
