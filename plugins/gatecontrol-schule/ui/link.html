<main class="sl" id="sl">
  <section class="card sl" aria-labelledby="sl-h">
    <div class="sl-head">
      <span class="acc-ic" aria-hidden="true" id="sl-ic"></span>
      <div class="acc-t">
        <h2 class="h2" id="sl-h">{{t:link.title}}</h2>
        <p class="hint" id="sl-lead">{{t:link.lead}}</p>
      </div>
    </div>
    <div class="sl-list" id="sl-list" aria-live="polite"></div>
    <div class="sl-actions">
      <button class="btn btn-primary" type="button" id="sl-add" hidden>{{t:link.add}}</button>
      <span class="hint" id="sl-off" hidden>{{t:link.off}}</span>
    </div>
  </section>
</main>
