<div class="dp mp" id="mp-root">
  <div class="dp-msg" id="mp-msg" hidden></div>
  <div class="mp-app" id="mp-app" hidden>
    <aside class="mp-nav" id="mp-nav" aria-label="{{t:p.nav}}"></aside>
    <section class="mp-list" id="mp-list" aria-label="{{t:p.list}}"></section>
    <section class="mp-read" id="mp-read" aria-label="{{t:p.read}}"></section>
  </div>
  <div class="dp-toast" id="mp-toast" role="status" aria-live="polite" hidden></div>
  <div class="dp-snack" id="mp-snack" role="status" aria-live="polite" hidden></div>
  <div class="dp-dialog-back" id="mp-dialog" hidden></div>
  <input type="file" id="mp-file" multiple hidden>
</div>
