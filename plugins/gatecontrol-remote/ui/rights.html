<main class="rm-page">
  <p class="rm-intro">{{t:rights.intro}}</p>
  <section class="rm-card" aria-labelledby="rm-r-h">
    <div class="rm-card-head"><h2 class="rm-card-title" id="rm-r-h">{{t:rights.title}}</h2></div>
    <div class="rm-table-wrap"><table class="rm-table rm-matrix" id="rm-rights"></table></div>
    <p class="rm-hint">{{t:rights.legend}}</p>
    <p class="rm-hint">{{t:rights.later}}</p>
    <p class="rm-hint">{{t:rights.rec_legend}}</p>
  </section>
  <section class="rm-card" aria-labelledby="rm-a-h">
    <div class="rm-card-head"><h2 class="rm-card-title" id="rm-a-h">{{t:access.title}}</h2></div>
    <p class="rm-hint">{{t:access.intro}}</p>
    <p class="rm-hint" id="rm-a-none" hidden>{{t:access.none}}</p>
    <div class="rm-table-wrap"><table class="rm-table rm-matrix" id="rm-access"></table></div>
  </section>
</main>
