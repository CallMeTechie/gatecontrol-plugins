<main class="rm-page rm-portal">
  <p class="rm-hint" id="rm-loading" role="status">{{t:common.loading}}</p>
  <section class="rm-card" aria-labelledby="rm-p-h" id="rm-p-card" hidden>
    <div class="rm-card-head">
      <h2 class="rm-card-title" id="rm-p-h">{{t:portal.devices}}</h2>
      <button class="btn btn-sm btn-primary" type="button" id="rm-code" hidden>{{t:portal.code_enter}}</button>
      <button class="btn btn-sm" type="button" id="rm-reload">{{t:portal.reload}}</button>
    </div>
    <input class="form-input" type="search" id="rm-search" placeholder="{{t:dev.search}}" aria-label="{{t:dev.search}}" hidden>
    <div class="rm-list" id="rm-list" aria-live="polite"></div>
    <p class="rm-hint" id="rm-none" hidden>{{t:portal.none}}</p>
    <p class="rm-hint">{{t:portal.hint}}</p>
  </section>
</main>
