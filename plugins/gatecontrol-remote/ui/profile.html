<main class="rm-page rm-portal">
  <section class="rm-card" aria-labelledby="rm-pr-h">
    <div class="rm-card-head"><h2 class="rm-card-title" id="rm-pr-h">{{t:profile.rights}}</h2></div>
    <ul class="rm-right-list" id="rm-rights" aria-live="polite"><li>{{t:common.loading}}</li></ul>
    <p class="rm-hint" id="rm-devs"></p>
    <p class="rm-hint">{{t:profile.hint}}</p>
  </section>
  <section class="rm-card" aria-labelledby="rm-ph-h" id="rm-hosts-card" hidden>
    <div class="rm-card-head"><h2 class="rm-card-title" id="rm-ph-h">{{t:profile.hosts}}</h2></div>
    <ul class="rm-right-list" id="rm-hosts"></ul>
    <h3 class="form-label">{{t:profile.history}}</h3>
    <div id="rm-hist" aria-live="polite"></div>
  </section>
</main>
