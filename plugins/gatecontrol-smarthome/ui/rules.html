<main class="sh-page">
  <div class="page-header">
    <div>
      <div class="page-eyebrow">{{t:eyebrow}}</div>
      <h1 class="page-title">{{t:rules.title}}</h1>
      <div class="page-sub">{{t:rules.subtitle}}</div>
    </div>
    <div class="page-actions">
      <select id="shr-gateway" class="form-select" aria-label="{{t:rules.gateway}}"></select>
      <button class="btn" type="button" data-nav="main">{{t:rules.back}}</button>
      <button class="btn" type="button" id="shr-gateway-count">{{t:rules.load_count}}</button>
      <button class="btn btn-primary" type="button" id="shr-new">{{t:rules.new}}</button>
    </div>
  </div>
  <div id="shr-limit" class="banner banner-warn" role="status" hidden></div>
  <div id="shr-count-hint" class="banner" hidden></div>
  <div id="shr-list" class="rule-list"></div>

  <div class="modal-overlay" id="shr-modal" role="dialog" aria-modal="true" aria-labelledby="shr-title" hidden>
    <div class="modal modal-wide">
      <div class="modal-head">
        <div class="modal-title" id="shr-title">{{t:rules.builder_title}}</div>
        <button class="btn modal-close" type="button" data-close="shr-modal" aria-label="{{t:common.close}}">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label" for="shr-name">{{t:rules.name_label}}</label>
          <input class="form-input" id="shr-name" type="text" maxlength="20">
        </div>
        <div class="builder-block">
          <div class="bb-head"><span class="bb-badge bb-when">{{t:rules.when}}</span></div>
          <div id="shr-when"></div>
          <button class="btn" type="button" id="shr-add-when">{{t:rules.add_condition}}</button>
        </div>
        <div id="shr-multi-hint" class="form-hint" hidden>{{t:rules.multi_hint}}</div>
        <div class="form-group">
          <label class="form-label" for="shr-from">{{t:rules.time_window}}</label>
          <div class="inline-row">
            <input class="form-input" id="shr-from" type="time" style="width:120px">
            <span>–</span>
            <input class="form-input" id="shr-to" type="time" style="width:120px" aria-label="{{t:rules.time_window}}">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="shr-delay-min">{{t:rules.delay}}</label>
          <input class="form-input" id="shr-delay-min" type="number" min="0" max="1440" style="width:120px">
        </div>
        <div class="form-group">
          <label class="form-label" for="shr-onretrigger">{{t:rules.on_retrigger}}</label>
          <select class="form-select" id="shr-onretrigger">
            <option value="ignore">{{t:rules.retrigger_ignore}}</option>
            <option value="reset">{{t:rules.retrigger_reset}}</option>
            <option value="cancel">{{t:rules.retrigger_cancel}}</option>
          </select>
        </div>
        <div class="builder-block">
          <div class="bb-head"><span class="bb-badge bb-then">{{t:rules.then}}</span></div>
          <div id="shr-then"></div>
          <button class="btn" type="button" id="shr-add-then">{{t:rules.add_action}}</button>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" type="button" data-close="shr-modal">{{t:common.cancel}}</button>
        <button class="btn btn-primary" type="button" id="shr-save">{{t:rules.save}}</button>
      </div>
    </div>
  </div>
</main>
