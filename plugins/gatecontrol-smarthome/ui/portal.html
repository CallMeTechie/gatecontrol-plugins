<main class="pt-sh">
  <div class="pt-hint" id="pt-sh-hint" hidden></div>
  <section class="card pt-card" id="pt-sh-card" aria-labelledby="pt-c-sh">
    <h2 class="pt-h2" id="pt-c-sh">{{t:portal.title}}</h2>
    <div class="pt-sh-tiles" id="pt-sh-tiles"></div>
    <div class="pt-sh-sensors" id="pt-sh-sensors" hidden>
      <div class="pt-overline">{{t:portal.sensors}}</div>
      <ul class="pt-sensor-list" id="pt-sh-sensor-list"></ul>
    </div>
    <p class="muted" id="pt-sh-empty" hidden></p>
  </section>
</main>
