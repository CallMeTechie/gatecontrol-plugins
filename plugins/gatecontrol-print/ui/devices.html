<main class="pr-page">
  <p class="pr-intro">{{t:dev.intro}}</p>
  <section class="pr-card" aria-labelledby="pr-dev-h">
    <div class="pr-card-head">
      <h2 class="pr-card-title" id="pr-dev-h">{{t:dev.found}}</h2>
      <span class="pr-sub" id="pr-dev-when"></span>
      <button class="btn btn-sm" type="button" id="pr-discover">{{t:dev.discover}}</button>
    </div>
    <div class="pr-list" id="pr-devices" aria-live="polite"></div>
    <p class="pr-hint" id="pr-none" hidden>{{t:dev.none}}</p>
    <p class="pr-hint">{{t:dev.airprint}}</p>
  </section>
</main>
