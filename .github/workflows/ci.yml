name: CI

# Validates every plugin, runs the plugin tests against the mock host and
# builds UNSIGNED packages as artifacts. Never has access to the signing key.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate, test, build (unsigned)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Validate plugin.json files
        run: node tools/validate.js

      - name: Test
        run: node tools/test.js

      - name: Build unsigned packages
        env:
          GC_PLUGIN_SIGNING_KEY: ''
        run: node tools/pack.js --all --out dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-packages
          path: dist/*.gcplugin
          if-no-files-found: error
          retention-days: 14
