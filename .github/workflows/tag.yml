name: Tag release

# Starts a plugin release without pushing a tag from a workstation: run it on
# main with the tag <id>-v<semver>. It checks the tag against plugin.json and
# CHANGELOG (same check as the release), creates the tag on the current main
# commit and dispatches release.yml on that tag. Building, signing and
# publishing stay in release.yml (environment plugin-release).
#
# A tag created with GITHUB_TOKEN does not fire the tag push trigger, which is
# why release.yml is dispatched explicitly (workflow_dispatch is allowed).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. gatecontrol-smarthome-v1.0.0'
        required: true
        type: string

permissions: {}

concurrency:
  group: tag-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  tag:
    name: Create tag and start release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - name: Only from the default branch
        env:
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$REF" != "refs/heads/${DEFAULT_BRANCH}" ]; then
            echo "::error::run this workflow on ${DEFAULT_BRANCH}, not ${REF}"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Check tag, plugin.json and CHANGELOG
        env:
          TAG: ${{ inputs.tag }}
        run: node tools/release-check.js "$TAG"

      - name: Create tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::tag ${TAG} already exists"
            exit 1
          fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${TAG}" -f sha="${GITHUB_SHA}" >/dev/null
          echo "Tagged ${GITHUB_SHA} as ${TAG}"

      - name: Start release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
